# Task 4 - Backend Monitoring Configuration
# Example configuration - not deployed yet.
# Merge the scrape job into the existing prometheus.yml.

scrape_configs:
  - job_name: "drone-backend"
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: https

    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/drone-backend-api-token

    static_configs:
      - targets:
          - "backend.example.lan:443"

